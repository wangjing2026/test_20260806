function fnnValidateWorkgroupSMB(pField,pErrStr)
{
    var lsInValidChars=";:\"<>*+=\\|?,";
    pVal=pField.value;
    var icount = 0;

    for(i=0;i<pVal.length;i++)
    {
        //if(document.getElementById("isJapanLang").value == "true")
        if(SelectedDest == "JPN")
        {
            if (((pVal.charCodeAt(i) < 0x0) || (pVal.charCodeAt(i) > 0x7F)) &&
                ((pVal.charCodeAt(i) < 0x3000 ) || (pVal.charCodeAt(i) > 0x9faf)) &&
                ((pVal.charCodeAt(i) < 0xff00 ) || (pVal.charCodeAt(i) > 0xff5f)))
            {
                alert(pErrStr);
                pField.select();
                pField.focus();
                return false;
            }
        }
        else
        {
            if ((pVal.charCodeAt(i) < 0x0) || (pVal.charCodeAt(i) > 0x7F))
            {
                alert(pErrStr);
                pField.select();
                pField.focus();
                return false;
            }

        }
        if(lsInValidChars.indexOf(pVal.charAt(i)) != -1)
        {
            alert(pErrStr);
            pField.select();
            pField.focus();
            return false;
        }
        if(pVal.charAt(i) == " ")
        {
            alert(pErrStr);
            pField.select();
            pField.focus();
            return false;
        }
        if (((pVal.charCodeAt(i) < 0x3000 ) || (pVal.charCodeAt(i) >0x9fa6)) &&
            (!((pVal.charCodeAt(i) > 0xff00 ) && (pVal.charCodeAt(i) <0xff5f))))
        {
            icount++;
        }
        else
        {
            icount += 2;
        }

    }
    if (icount > pField.maxLength)
    {
        alert(fnGetLocaleString("101846","The input character length is too long."))
        pField.select();
        pField.focus();
        return false;
    }

    return true;
}

function fnnValidateIP(object)

    /*if((object.name == "id1") && (sIP == ""))
    {
        alert(gsErrMsg10085 + "(" + fnGetLocaleString("100952","IP Address") + ")");
        object.focus();
        object.select();
        return false;
    }*/

    if ((sIP != "") && (!fnbValidateForNumber(sIP)))
    {
        alert(gsErrMsg10085 + "(0 - 9)");
        object.focus();
        object.select();
        return false;
    }
    if ((iIP>255) || (iIP<0))
    {
        alert(gsErrMsg10085 + "(0 - 255)");
        object.focus();
        object.select();
        return false;
    }
}

function fnnSetIP(objHidden,arrIPId) {
    var bFlag=false;
    bDisabled = false;
    sIPAddr = "";

    if(arrIPId[0].value == "")
        lbIPpresent = false;
    else
        lbIPpresent = true;
    for(i=0;i<4;i++)
    {
        if(fnnValidateIP(arrIPId[i])==false)
            return;
    }
    for(i=0;i<4;i++)
    {
        sIP = arrIPId[i].value;
        if (lbIPpresent != (sIP != ""))
        {
            bFlag = true;
        }
    }
    if (bFlag)
    {
        //Now set the focus to the first IP quadrant that has ""
        var i;
        for(i=0;i<4;i++)
        {
            if(arrIPId[i].value == "")
                break;
        }
        alert(gsErrMsg10085 + "( 0-255 )");
        arrIPId[i].focus();
        return false;
    }
    for(i=0;i<4;i++)
    {
        if(arrIPId[i].value=="00" || arrIPId[i].value== "000")
        {
            arrIPId[i].value="0";
        }
    }
    if(lbIPpresent)
    {
        if(!isNaN(arrIPId[0].value))
            sIPAddr +=parseInt(arrIPId[0].value,10) + ".";
        if(!isNaN(arrIPId[1].value))
            sIPAddr +=parseInt(arrIPId[1].value,10) + ".";
        if(!isNaN(arrIPId[2].value))
            sIPAddr +=parseInt(arrIPId[2].value,10) + ".";
        if(!isNaN(arrIPId[3].value))
            sIPAddr +=parseInt(arrIPId[3].value,10);
    }
    objHidden.value = sIPAddr;

    return true;
}

function fnnWriteIPElements(sIPAddr,sIPId)//<P>sIPAddr<P> string that holds the IP Address (A.B.C.D)
{
    larrIPAddr = sIPAddr.split(".");//array that holds the IP address classes i.e., {A,B,C,D}

function fnnLoadSMBLogon() {
    if(opener.getValue("SMB_DomainLogin") == 1) {
        document.frmNetwork.CHKWORKGROUPDOMAIN[0].checked=false;
        document.frmNetwork.CHKWORKGROUPDOMAIN[1].checked=true;
        fnnWORKGROUPDOMAIN(1);
    } else {
        document.frmNetwork.CHKWORKGROUPDOMAIN[0].checked=true;
        document.frmNetwork.CHKWORKGROUPDOMAIN[1].checked=false;
        fnnWORKGROUPDOMAIN(0);
    }
    setValue("userName_guestLogon",opener.getValue("SMB_AuthUserName"));
    setValue("HID_passwordGuestLogon",opener.getValue("SMB_Password"));
}

function fnnSetSMBLogon() {
    var  frmObject = document.frmNetwork;
    if(document.frmNetwork.CHKWORKGROUPDOMAIN[1].checked) {
        //alert("Domain checked")
        opener.setValue("SMB_Workgroup", "")
        opener.setValue("SMB_Domain", frmObject.STRDOMAIN.value)
        opener.setValue("SMB_Primary", frmObject.STRPRIDOMAINCONTROLLER.value)
        opener.setValue("SMB_Controller", frmObject.STRBACKDOMAINCONTROLLER.value)
        opener.setValue("SMB_UserName", frmObject.STRDEVICE.value)
    } else {
        //alert("Workgroup checked")
        opener.setValue("SMB_Workgroup", frmObject.STRWORKGROUP.value)
        opener.setValue("SMB_Domain", "")
        opener.setValue("SMB_Primary", "")
        opener.setValue("SMB_Controller", "")
        opener.setValue("SMB_UserName", "")
    }
}
/* Added for  IPV6 enable/disable Combobox to Radiobuttons in SMB network settings */
function fnSelectVersion()
{
	var status = opener.getValue("IPv6_Enable");
    var selIP = opener.getValue("SMB_EnableIPv6")
    var lobjform = document.frmNetwork;

	if (status == "1") {
		if (selIP == "IPV6") {
			lobjform.SELENASMBIPV6[1].checked = true;
		} else if(selIP == "IPV4") {
			lobjform.SELENASMBIPV6[0].checked = true;
        }
		lobjform.SELENASMBIPV6[1].disabled = false;
	} else if (status == "0") {
		lobjform.SELENASMBIPV6[0].checked = true;
		lobjform.SELENASMBIPV6[1].checked = false;
		lobjform.SELENASMBIPV6[1].disabled = true;
	}
}
function fnisJapaniseLang() {
    var localeCookieStr = top.fnGetCookie("Locale");
    var localeArr=null;
    if(localeCookieStr!=null || localeCookieStr !=""){
        try{
            localeCookieStr = localeCookieStr.replace(/#[\w \s = . ; #]*,/gi,",");
            localeCookieStr = localeCookieStr.replace(/#[\w \s = .]*/gi,"");   //This is for the last locale value in the string
            localeArr = localeCookieStr.split(",");
            localeArr=localeArr[0].split("-");        //alert(helpFilePath)
            if(localeArr[0].toUpperCase() == "JA"){
                document.getElementById("isJapanLang").value="true";
            } else {
                document.getElementById("isJapanLang").value="false";
            }
        }catch(E){document.getElementById("isJapanLang").value="false";}
    }
}
function fnChkHDD(){
