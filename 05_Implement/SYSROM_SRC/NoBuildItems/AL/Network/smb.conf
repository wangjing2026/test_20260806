[global]
workgroup=Workgroup
server string=SMB Server
netbios name=
realm=
log level=3
log file=/ramdisk/al/network/log/log.smbd
max log size=10000
max smbd processes=100
security=user
password server=
wins support=no
default devmode=no
client NTLMv2 auth=No
wins proxy=no
server max protocol=SMB3
client max protocol=SMB3
dns proxy=no
wins server=
name resolve order = lmhosts host wins bcast purev6
DeviceAuthTimeout=60
map to guest=bad user
guest only=no
guest account=root
load printers=yes
printcap name=/dev/null
printing=lprng
local master=no
encrypt passwords=yes
deadtime=60
server signing=auto
client signing=auto
dos charset=CP932
SRAM Logging=no
include=%$(AL_NET_CONF)/smb_print_share.conf
Pedestal=0
FinisherUnit=0
PunchUnit=0
hostAnnouncementSSL=0
sambaCliConnectionTimeout=30
clientAuthFlag=No

[Print]
path=/smbprefix
max connections=13
browseable=no
printable=yes
writeable=yes
guest ok=yes
available=1
comment=

[FILE_SHARE]
path=/storage/sharedfolder
max connections=13
browseable=yes
writeable=no
public=no
guest ok=yes
available=1

[DRIVER_INST]
path=/work/drivers/pointNprint 
max connections=13 
browseable=no 
writeable=no 
public=no 
guest ok=yes 
hide files=/work/drivers/pointNprint/*/ 
available=1

[PS3_driver]
